# Single-host deploy where PostgreSQL runs on the **host machine** (not in a
# container). The app container reaches it via `host.docker.internal`, which is
# mapped to the host gateway by the `extra_hosts` entry below.
#
# Provide secrets via a `.env` file (see `.env.example`). DATABASE_URL must use
# the `host.docker.internal` host, e.g.:
#   DATABASE_URL="postgresql://postgres:postgres@host.docker.internal:5432/tautree?schema=public"
#
# Bring everything up with:
#   docker compose up -d --build
# Migrations run automatically on container start: entrypoint.sh runs
# `prisma migrate deploy` before launching the server.

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
