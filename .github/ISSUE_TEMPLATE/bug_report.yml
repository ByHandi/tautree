name: 🐛 Bug report
description: Report something that isn't working as expected
title: "[TAUTREE-XX] fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I click X, Y happens — but I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can see it too.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tautree version or commit
      description: The release you're running, or the commit if you're on a branch (`git rev-parse --short HEAD`).
      placeholder: v0.1.1 or 226c695
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does this happen?
      options:
        - Local dev (npm run dev)
        - Self-hosted (Docker / Coolify)
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment details
      description: Node version, browser, deploy target, relevant logs — anything that helps.
      placeholder: |
        - Node: 24.x
        - Browser: Chrome 140
        - Deploy: Coolify
    validations:
      required: false
